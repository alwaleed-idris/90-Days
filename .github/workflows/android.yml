name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Copy web app into the Android project
        run: |
          npm ci
          npm run sync

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk 90-day-game-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 90-day-game-apk
          path: 90-day-game-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-1.0.${{ github.run_number }}
          name: 90 Day Game 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'master' }}
          files: 90-day-game-*.apk
          body: |
            حمّل ملف الـ APK من الأسفل وثبّته على هاتف أندرويد.
            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.
